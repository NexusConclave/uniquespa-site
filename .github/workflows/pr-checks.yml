# Pull request -> install, build, run every test, and keep the built site as an artifact for the preview.
# This workflow runs the pull request's own code, so it gets NO secrets and NO environment: it can't deploy anything.
# The preview itself is published by preview-deploy.yml, which runs from main, checks this artifact, and waits for
# Katy's approval (review finding 1). Going live is production.yml (also needs Katy's approval).
name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Hard rule: prices and specials come only from the facts source (Square).
      # A PR that touches the price/special data files fails until Katy or Ian adds
      # the label "prices-from-facts" after checking the numbers against Square.
      - name: Price guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'prices-from-facts') }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- src/data/services.json src/data/square-lock.json src/data/offers.json facts/facts.public.json)"
          if [ -z "$changed" ]; then
            echo "No price or special data files changed."
            exit 0
          fi
          echo "Price/special data files changed:"
          echo "$changed"
          git diff "$BASE_SHA"...HEAD -- src/data/services.json src/data/square-lock.json src/data/offers.json facts/facts.public.json \
            | grep -E '^[+-].*"(price|price_cents|price_type|square_id|starts|ends|approved|status)"' || true
          if [ "$HAS_LABEL" != "true" ]; then
            echo "::error::This PR changes prices or specials. Check every number against Square, then add the label 'prices-from-facts'."
            exit 1
          fi
          echo "Label 'prices-from-facts' present: allowed."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install browser for tests
        run: |
          python -m pip install --quiet playwright==1.63.0
          python -m playwright install --with-deps chromium

      # The preview is the production build (approved content only), so Katy sees
      # exactly what would go live. Drafts render only with PREVIEW=1.
      - name: Build
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: npm run build

      - name: Test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: npm test

      # Preview bundle = exactly what was built and tested: the static site (dist), the Pages Functions
      # (/api/chat, /api/lead, /api/health, /api/event) and the code they import (src/lib). preview-deploy.yml
      # treats it as untrusted: it checks it and deploys it with main's wrangler.toml, never this branch's.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-bundle
          path: |
            dist
            functions
            src/lib
            wrangler.toml
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 7
